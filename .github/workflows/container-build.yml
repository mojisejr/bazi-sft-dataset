name: container-build
# Proves the image still builds from this revision, is hygienic, and carries every runtime-file manifest entry
# (mumate-infra-move-001 slice 1). Runs scripts/container-smoke.sh --no-db — the SAME script a developer runs
# locally. The database / engine / webhook legs need the arena and run locally before a PR is marked ready;
# CI says so explicitly instead of printing a green it did not earn.
#
# MANUAL ONLY (owner decision 2026-09-19): the launch lane must not see this job on its pull requests and CI
# minutes are paid. Run it from the Actions tab when a container change needs a second machine's proof, or with
# push=true to publish ghcr.io/mojisejr/bazi-sft-dataset:<sha> for the control room (mumate-infra-move-001 slice 3;
# tag = the exact commit, never latest — #637 §8.3). GITHUB_TOKEN with packages:write is enough for GHCR on
# this repository; no PAT, no secret added. Default input is false, so a plain dispatch changes nothing.
on:
  workflow_dispatch:
    inputs:
      push:
        description: "push ghcr.io/mojisejr/bazi-sft-dataset:<sha>[-target] (owner decision per slice; false = build + smoke only)"
        type: boolean
        default: false
      target:
        description: "which public values to inline (GitHub Environment variables): staging -> tag <sha>-staging, production -> tag <sha>"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    # Environment variables (Settings -> Environments -> staging|production -> Variables) hold the PUBLIC values Next
    # inlines at build time; they are publishable keys / ids, never secrets. Referencing the environment creates it.
    environment: ${{ inputs.target || 'staging' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build + hygiene + runtime-file manifest (no database in CI)
        run: bash scripts/container-smoke.sh --no-db
      - name: login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: release build for ${{ inputs.target }} (Next inlines NEXT_PUBLIC_* at build time, so the smoke image cannot ship) + push by SHA
        if: ${{ inputs.push }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          suffix=""; [ "${{ inputs.target }}" = production ] || suffix="-${{ inputs.target }}"
          dst="ghcr.io/mojisejr/bazi-sft-dataset:${sha}${suffix}"
          # same Dockerfile the smoke just proved; only the public build values differ (tag = exact commit [+ target], never latest)
          docker build --build-arg "APP_GIT_SHA=${sha}" \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
            --build-arg NEXT_PUBLIC_LIFF_ID="${{ vars.NEXT_PUBLIC_LIFF_ID }}" \
            -t "$dst" . | tail -3
          docker push "$dst"
          echo "pushed $dst (target=${{ inputs.target }})" >> "$GITHUB_STEP_SUMMARY"
